site:
  name: 'Rebel-State'
  # Path to the site logo used in components (must be accessible under /assets/...)
  logo: '/assets/images/rebel-state-logo.svg'
  site: 'https://rebel-state.net'
  base: '/'
  trailingSlash: false

  googleSiteVerificationId: false

# Default SEO metadata
metadata:
  title:
    default: 'Rebel-State'
    template: '%s — Rebel-State'
  description: 'Empowering organizations with the engineering, education and confidence to deliver the next generation of services, intellegence and operational sovereignty.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: 'Rebel-State'
    images:
      - url: '~/assets/images/rebel-state-logo.svg'
        width: 1132
        height: 297
        alt: 'Rebel-State'
    type: website
  twitter:
    handle: '@rebelstate'
    site: '@rebelstate'
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/articles/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'articles' # Blog main path, you can change this to "articles" (/articles)
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category' # Category main path /category/some-category, you can change this to "group" (/group/some-category)
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag' # Tag main path /tag/some-tag, you can change this to "topics" (/topics/some-category)
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null # or "G-XXXXXXXXXX"

ui:
  theme: 'system' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"
